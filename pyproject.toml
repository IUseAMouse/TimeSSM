[project]
name = "timessm"
version = "0.1.0"
description = "TimeSSM: a linear time-invariant state space forecaster with a rate knob"
authors = [
    {name = "Yvann VINCENT", email = "yvann.vincent@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
# Inference needs torch, hydra (configs) and pyyaml (the frequency table).
# Training and the GIFT-Eval harness come from the timejepa package, behind
# the `train` extra: the two environments must resolve to the same stack, so
# the constraints below are aligned on TimeJEPA's pyproject. The CUDA build
# caveat of that file applies here too (pin the wheel index on a rented GPU).
dependencies = [
    "torch>=2.8.0",
    "numpy>=2.3.0",
    "einops>=0.7.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
# Training (scripts/train_ssm.py), the GIFT-Eval harness (scripts/eval_ssm.sh)
# and the diagnostics import timejepa. Local checkout next to this repo
# through [tool.uv.sources]; the git URL otherwise.
train = [
    "timejepa @ git+https://github.com/IUseAMouse/TimeJEPA.git@sota-roadmap",
    "pytorch-lightning>=2.5.0",
    "wandb>=0.22.0",
]
# The March 2025 Mamba code lives under legacy/ with its own pyproject and
# lock (git tag mamba-2025 for the layout it had at the root).
dev = [
    "pytest>=8.0.0",
    "black",
    "isort",
    "flake8",
]

[tool.uv.sources]
timejepa = { path = "../TimeJEPA", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true   # the timejepa git URL of the train extra

[tool.hatch.build.targets.wheel]
packages = ["src/timessm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
