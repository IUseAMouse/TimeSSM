# @package _global_
# Continuation: launch with SEED0=<seed never used by the run it resumes from>
# (train_ssm_loop.sh), otherwise the sampler replays that run's batch sequence.
#
# Frequency-tied Delta: resume the 2.5M wide checkpoint (weights only, fresh
# optimizer, the parent's short cosine) and set Delta from the declared
# sampling frequency of each series instead of a random draw, w = 24 / season
# (FlowState's rule, timejepa.data.frequency). One reference cycle then spans
# the same model time whatever the sampling rate: a 15-minute series runs at
# w = 0.25, hourly at 1, daily with a weekly cycle at 3.43, monthly at 2.
#
# Differences from the parent:
#   * no parameter is added: the parent's checkpoint loads as it is;
#   * the frequency comes from a table versioned in TimeJEPA (file stem ->
#     frequency); a corpus file missing from it is an error; files declared
#     without a frequency (`null`) keep the random draw as an augmentation;
#   * validation runs with the tied Delta too, so its loss is not comparable
#     with the parent's (which validates at Delta scale 1);
#   * delta_range widens to [1/64, 8]: quarterly, yearly and 6-hourly series
#     ask for w = 6.
#
#   scripts/train_ssm_loop.sh ssm_mini_v3_freq ssm-mini-v3-freq \
#       '+training.pretrained_encoder_path=checkpoints/timessm_mini_v3_wide_zs/pretrain_False/epoch00_valloss1.2841.ckpt'
#   # eval: EVAL_CONFIG=ssm_mini_v3_freq_eval STACK="+freq_delta=true" ONLY=<stem> scripts/eval_checkpoints_ssm.sh <dir>
defaults:
  - ssm_mini_v3_wide
  - _self_

model:
  name: "timessm_mini_v3_freq_zs"
  ssm:
    delta_from_frequency: true
    delta_range: [0.015625, 8.0]

data:
  frequency_table: "../TimeJEPA/configs/corpus_v3_frequencies.yaml"

wandb:
  tags: ["timessm", "ssm", "lti", "frequency-tied-delta", "resume", "lotsa", "v3", "mini"]
