# @package _global_
# PatchedSSM on corpus v5. Training and evaluation read this same file:
#
#   python scripts/train_patched.py --config configs/patched/base.yaml run.name=<name> [key=value...]
#   EVAL_CONFIG=patched/base scripts/eval_ssm.sh <run>/last.ckpt +freq_delta=true +tta_flip=true
model:
  name: "timessm_patched"
  builder: "timessm.patched:build_from_config"
  seq_length: 4096
  prediction_length: 256
  patch: 16
  d_model: 320
  n_layers: 4
  d_state: 32
  expand: 2
  n_heads: 8
  attention: true
  dropout: 0.0
  robust_norm: false
  stats: false         # scale-free context statistics added to every token
  causal: false        # causal attention and frame, every context token forecasts its next patch
  loops: 1             # passes through the block stack, weights shared
  mixers: null         # per layer "ssm" or "delta", null = all ssm
  head_quantiles: 9    # levels the head learns, 9 or 21; forecast always returns the 9
  patches: null        # extra patch sizes, e.g. [8, 32]; one drawn per step, chosen per series at inference

run:
  name: null
  out: "/workspace/runs"
  seed: 0
  resume: null
  eval_every: 10000

training:
  steps: 100000
  batch: 512
  lr: 5.0e-4
  weight_decay: 0.02
  warmup: 2000
  max_horizon: 720
  loss: "asinh"        # asinh, ratio or logratio
  ema: 0.999           # 0 = off
  context_loss: 0.0    # weight of the next-patch loss of the context tokens (causal models)
  context_skip: 2      # first tokens not scored, their running statistics are too noisy

data:
  root: "/workspace/data/v5"
  workers: 24
  p_decimate: 0.5
  p_flip: 0.5
  p_synth: 0.5
  p_full: 0.0          # share of windows with all the history available, up to the context
  p_mix: 0.0           # share of windows replaced by a mix of 2-3 same-rate windows
  temperature: 0.3
  groups: 12           # distinct subsets per batch, bounds the S4D kernels per step
  include_dev: false
