# @package _global_
# SCALING POINT 2 (2026-09-14): the spike's architecture at 10M (d_model 384,
# 8 blocks, 32 states) - one variable against ssm_mini_v3, capacity. DDP, not
# FSDP: at 10-20M the optimizer states are small, DDP is the validated path.
#
# Default = the current pod, 3x RTX 3090 (24 GB): batch 48 x accumulation 8 x
# 3 GPUs = 1152 effective, the champion's recipe. Activations are ~2x the
# 2.5M model's per item (d_inner 768). Batch 64 (19.6 GiB on the fixed-1024
# profile) died twice in the real run: fragmentation at 4h45 (fixed by
# expandable segments), then a plain OOM at 22.8 GiB allocated after 10 h
# (2026-09-15) - the training peak sits ~3 GiB above the profile (cuFFT
# workspaces for the batched transforms, DDP buckets, val-loop residue: not
# pinned down). Batch 48 costs nothing in throughput (129 vs 134 windows/s,
# memory-bound regime) and leaves ~6 GiB of headroom.
#
#   python scripts/train_ssm.py --config-name ssm_mid_v3 wandb.run_name=ssm-mid-v3
#
# Rented 8-GPU pod (5090 32 GB or A100 80 GB), same effective batch:
#   ... data.batch_size=48 trainer.accumulate_grad_batches=3 data.num_workers=2
#   and training.schedule_fraction recomputed so that batches x 48 x 8 = 298M
#
# Budget: the 2.5M plateaued at 7.5% of ITS epoch (223M windows). The budget
# is counted in WINDOWS, not in epoch fractions: the sampler's epoch depends on
# the batch size (the largest family gets floor(p x batch) >= 1 samples per
# batch: 2 at batch 128, 1 at batch 64, so the batch-64 "epoch" is 5.96 B
# windows, twice the 2.98 B of the 2.5M run). schedule_fraction 0.05 at batch 64
# = 298M windows. NOTE (2026-09-20): the figures 1.55M / 2.07M batches above
# were computed on the NOMINAL batch; with the integer allocation the realized
# batch was neither 64 nor 48 (106 families clamped at 1). With
# fractional_batch the realized batch averages batch_size, and the fraction is
# read from scripts/audit_batch_sizes.py (it prints it for 298M windows).
# Measured 2026-09-15 under DDP: 3.14 it/s per GPU = 603 windows/s on 3x 3090
# (random contexts are shorter than the 1024 of the profile) -> ~5.7 days;
# checkpoints every 5% of the run. If the stack still descends at the last
# checkpoint, resume with +training.resume_ckpt on a longer fraction.
# Memory profile (fixed 1024 context, 1 GPU): batch 48 15.2 GiB, 64 19.6 GiB,
# 80 and 96 OOM; batch 128 + activation checkpointing 9.6 GiB but slower (107
# vs 134 windows/s). The allocator runs with expandable segments (train_ssm.py).
# Resume after a crash: +training.resume_ckpt=<last checkpoint> - the loop
# state, optimizer and scheduler are restored; a batch change between runs
# keeps the effective batch and the optimizer step count (see above).
# Multi-rate training keeps the wide list: the wide arm improved the body by
# 0.8 pt in decimation mode (0.5445 -> 0.5361) even though the knob itself
# lost; the knob is not evaluated, the stack is.
#
# P-SSM.4 (graved before the run): stack flip + mix + pool at the last
# checkpoint <= 0.515 (10 pt under head8, 1 pt under the 2.5M champion 0.5257);
# FAILURE if >= 0.525: capacity is not the lever at this data budget either.
defaults:
  - ssm_mini_v3
  - _self_

model:
  name: "timessm_mid_v3_zs"
  ssm:
    d_model: 384
    n_layers: 8
    d_state: 32
    activation_checkpointing: false

training:
  delta_scales: [0.020833, 0.03125, 0.041667, 0.0625, 0.083333, 0.125, 0.166667, 0.25, 0.333333, 0.5, 1.0, 2.0, 4.0]
  p_delta_scale: 0.7
  # null on purpose (a `???` would not override the parent's 0.3 through the
  # defaults merge): the epoch length depends on the realized batch, which
  # depends on the corpus. scripts/audit_batch_sizes.py prints the fraction
  # for 298M windows; pass it: training.schedule_fraction=<value>.
  schedule_fraction: null
  lr_scheduler:
    # Warmup is in EPOCH units like schedule_fraction: 0.006667 = 10% of the
    # run (25.9k optimizer steps), the wide arm's convention. Inherited, the
    # 2.5M's 0.1 would exceed this 0.06667 run: the whole run in warmup, LR at
    # 4% of its peak at the 5% checkpoint (measured on the first launch,
    # 2026-09-16). train_ssm.py refuses a warmup that is not shorter than the run.
    warmup_epochs: 0.006667

data:
  batch_size: 48
  num_workers: 8
  # Sampler fixes (2026-09-18/20, TimeJEPA TemperatureSampler, both opt-in):
  # fractional_batch keeps the T=0.5 mix at a batch smaller than the 106
  # families (the integer allocation gave 1 per family: temperature gone in
  # train, UNIFORM validation mix - the 10M's val_loss 3.0 vs 1.3 for the 2.5M
  # was a different validation set), and the realized batch averages
  # batch_size instead of being set by the quotas. max_batch_size defers the
  # deterministic quota bursts (three processes died of OOM at their 111,111th
  # batch) - equal to batch_size, the average is below it, the backlog stays
  # bounded and the memory peak is that of batch_size windows.
  fractional_batch: true
  max_batch_size: 48

trainer:
  accumulate_grad_batches: 8
  val_check_interval: 0.05
  strategy: "ddp_find_unused_parameters_true"

wandb:
  tags: ["timessm", "ssm", "lti", "scaling", "10M", "lotsa", "v3", "ddp"]
